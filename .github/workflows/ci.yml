# Test gate. Source code has landed, so the placeholder test step is now the
# project's real one: the bridge's pure-logic unit tests (stdlib unittest,
# no ROS / Isaac Sim / CAN hardware required), markdownlint over README.md, and
# a check that the repository standard files are present and parse.
#
# Tests live in their own workflow: they run on pull requests, while the release
# workflow runs on pushes to the default branch. Mixing the two means a broken
# release blocks a pull request, or the reverse.
#
# AGENTS.md is deliberately not linted: it is canonical content synced from
# repo-template and must not be edited here.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "README.md"

      - name: Validate repository standards
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test -s LICENSE
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          echo "repository standards OK"
